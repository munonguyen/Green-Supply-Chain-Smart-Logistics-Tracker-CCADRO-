server:
  port: 8088
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ccadro}
    username: ${DB_USER:ccadro}
    password: ${DB_PASSWORD:ccadro_dev_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
      missing-topics-fatal: false
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-email-status-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

ccadro:
  payment:
    vatRate: ${CCADRO_PAYMENT_VAT_RATE:0.08}
    evGreenDiscountRate: ${CCADRO_PAYMENT_EV_DISCOUNT_RATE:0.05}
    lngGreenDiscountRate: ${CCADRO_PAYMENT_LNG_DISCOUNT_RATE:0.03}
    net30Days: ${CCADRO_PAYMENT_NET30_DAYS:30}
    defaultDueDays: ${CCADRO_PAYMENT_DEFAULT_DUE_DAYS:3}
    merchantBankCode: ${CCADRO_PAYMENT_BANK_CODE:VCB}
    merchantAccountNo: ${CCADRO_PAYMENT_BANK_ACCOUNT:1038889999}
    merchantAccountName: ${CCADRO_PAYMENT_ACCOUNT_NAME:CCADRO GREEN LOGISTICS JSC}
    webhookSecret: ${CCADRO_PAYMENT_WEBHOOK_SECRET:}
    vnpayTmnCode: ${CCADRO_VNPAY_TMN_CODE:}
    vnpayHashSecret: ${CCADRO_VNPAY_HASH_SECRET:}
    vnpayPayUrl: ${CCADRO_VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    vnpayReturnUrl: ${CCADRO_VNPAY_RETURN_URL:http://localhost:5173/customer?payment=vnpay-return}
    payosClientId: ${CCADRO_PAYOS_CLIENT_ID:}
    payosApiKey: ${CCADRO_PAYOS_API_KEY:}
    payosChecksumKey: ${CCADRO_PAYOS_CHECKSUM_KEY:}
    defaultCreditLimitVnd: ${CCADRO_CONTRACT_DEFAULT_CREDIT_LIMIT:500000000}
    defaultSlaOnTimePct: ${CCADRO_CONTRACT_SLA_ONTIME_PCT:98.5}
    defaultMaxTempDeviationC: ${CCADRO_CONTRACT_MAX_TEMP_DEV_C:2.0}
    defaultSlaPenaltyPct: ${CCADRO_CONTRACT_SLA_PENALTY_PCT:5.0}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:false}
    operationsSorter: method
    tagsSorter: alpha


# Evidence settings are separate from payment provider credentials.
# Configuration lives under ccadro.evidence via property names below.

# Spring accepts dotted keys alongside the ccadro mapping above.
ccadro.evidence.legal-name: ${CCADRO_LEGAL_NAME:Công ty Cổ phần Logistics Xanh CCADRO}
ccadro.evidence.tax-code: ${CCADRO_LEGAL_TAX_CODE:0316888999}
ccadro.evidence.business-license: ${CCADRO_LEGAL_BUSINESS_LICENSE:0316888999 - Sở KH&ĐT TP.HCM}
ccadro.evidence.address: ${CCADRO_LEGAL_ADDRESS:Khu Công Nghệ Cao, TP. Thủ Đức, TP. Hồ Chí Minh}
ccadro.evidence.representative-name: ${CCADRO_LEGAL_REPRESENTATIVE:Nguyễn Minh Quân}
ccadro.evidence.representative-title: ${CCADRO_LEGAL_REP_TITLE:Tổng Giám Đốc}
ccadro.evidence.support-email: ${CCADRO_LEGAL_SUPPORT_EMAIL:legal-billing@ccadro.vn}
ccadro.evidence.response-time: ${CCADRO_LEGAL_RESPONSE_TIME:24 giờ làm việc}
ccadro.evidence.notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
ccadro.evidence.internal-token: ${CCADRO_INTERNAL_TOKEN:}
ccadro.evidence.max-attempts: ${CCADRO_EVIDENCE_MAX_ATTEMPTS:10}
ccadro.evidence.retry-seconds: ${CCADRO_EVIDENCE_RETRY_SECONDS:60}
ccadro.evidence.kafka-enabled: ${CCADRO_PAYMENT_KAFKA_ENABLED:true}
ccadro.evidence.kafka-topic: ${CCADRO_KAFKA_PAYMENT_EVIDENCE_TOPIC:ccadro.payment.evidence.v1}
ccadro.evidence.email-status-topic: ${CCADRO_KAFKA_PAYMENT_EMAIL_STATUS_TOPIC:ccadro.payment.email.status.v1}

ccadro.payment.allow-instant-confirm: ${CCADRO_PAYMENT_ALLOW_INSTANT_CONFIRM:false}

# Infrastructure registry is separate from business UI. dev-start enables registration.
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: true
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_ID:${server.port}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health
