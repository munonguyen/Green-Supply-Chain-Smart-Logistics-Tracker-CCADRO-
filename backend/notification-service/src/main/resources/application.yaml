server:
  port: 8087
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ccadro}
    username: ${DB_USER:ccadro}
    password: ${DB_PASSWORD:ccadro_dev_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
      missing-topics-fatal: false
    consumer:
      group-id: notification-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

ccadro:
  notification:
    deduplicationWindowSeconds: ${CCADRO_NOTIFICATION_DEDUP_SECONDS:300}
    sseTimeoutMs: ${CCADRO_NOTIFICATION_SSE_TIMEOUT_MS:1800000}
  kafka:
    emergency-topic: ${CCADRO_KAFKA_EMERGENCY_TOPIC:ccadro.emergency.notifications}
    payment-evidence-topic: ${CCADRO_KAFKA_PAYMENT_EVIDENCE_TOPIC:ccadro.payment.evidence.v1}
    payment-evidence-dlq-topic: ${CCADRO_KAFKA_PAYMENT_EVIDENCE_DLQ_TOPIC:ccadro.payment.evidence.dlq}
    payment-email-status-topic: ${CCADRO_KAFKA_PAYMENT_EMAIL_STATUS_TOPIC:ccadro.payment.email.status.v1}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:false}
    operationsSorter: method
    tagsSorter: alpha

notification:
  email:
    mode: ${CCADRO_EMAIL_MODE:AUTO}
    brevo-url: ${CCADRO_BREVO_URL:https://api.brevo.com}
    brevo-apikey: ${CCADRO_BREVO_API_KEY:}
    sender-email: ${CCADRO_EMAIL_SENDER:noreply@ccadro.com}
    sender-name: ${CCADRO_EMAIL_SENDER_NAME:CCADRO Green Logistics}


ccadro.internal-token: ${CCADRO_INTERNAL_TOKEN:}
ccadro.payment-email.max-attempts: ${CCADRO_EVIDENCE_MAX_ATTEMPTS:10}
ccadro.payment-email.retry-seconds: ${CCADRO_EVIDENCE_RETRY_SECONDS:60}

notification.email.reply-to-email: ${CCADRO_LEGAL_SUPPORT_EMAIL:}

# Infrastructure registry is separate from business UI. dev-start enables registration.
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: true
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_ID:${server.port}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health
