spring:
  application:
    name: ccadro-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA & Hibernate (Flyway controls schema migrations)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Springdoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# CCADRO Business & Algorithm Configuration Defaults
ccadro:
  routing:
    provider: ${ROUTING_PROVIDER:mock}
    baseUrl: ${ROUTING_BASE_URL:http://router.project-osrm.org}
    connectTimeoutMs: 5000
    readTimeoutMs: 10000
  traffic:
    provider: ${TRAFFIC_PROVIDER:mock}
  weather:
    provider: ${WEATHER_PROVIDER:mock}
  deviation:
    yellowMeters: ${CCADRO_DEVIATION_YELLOW_METERS:50}
    redMeters: ${CCADRO_DEVIATION_RED_METERS:200}
    consecutivePointsRequired: 3
  rerouting:
    minimumBenefit: ${CCADRO_REROUTING_MINIMUM_BENEFIT:0.10}
    cooldownSeconds: ${CCADRO_REROUTING_COOLDOWN_SECONDS:300}
    hysteresisSeconds: ${CCADRO_REROUTING_HYSTERESIS_SECONDS:60}
    hardEventBypass: ${CCADRO_REROUTING_HARD_EVENT_BYPASS:true}
  optimization:
    carbonWeight: ${CCADRO_OPTIMIZATION_CARBON_WEIGHT:0.40}
    timeWeight: ${CCADRO_OPTIMIZATION_TIME_WEIGHT:0.30}
    costDistanceWeight: ${CCADRO_OPTIMIZATION_COST_WEIGHT:0.20}
    riskWeight: ${CCADRO_OPTIMIZATION_RISK_WEIGHT:0.10}
    paretoEnabled: ${CCADRO_OPTIMIZATION_PARETO_ENABLED:true}
  carbon:
    defaultTonneKmFactor: ${CCADRO_CARBON_DEFAULT_TONNE_KM_FACTOR:0.080000}
    distanceAdjustmentFactor: ${CCADRO_CARBON_DAF:1.05}
    applyDafOnActualGps: ${CCADRO_CARBON_APPLY_DAF_ON_ACTUAL_GPS:false}
    factorVersion: ${CCADRO_CARBON_FACTOR_VERSION:GLEC_v3.0}
  demerit:
    warningThreshold: ${CCADRO_DEMERIT_WARNING_THRESHOLD:10}
    reviewRequiredThreshold: ${CCADRO_DEMERIT_REVIEW_THRESHOLD:20}
  security:
    jwtSecret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

