server:
  port: 8888

app:
  api-prefix: /api/v1

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    urls:
      - name: 1. Identity Service (Port 8080)
        url: /services/identity/v3/api-docs
      - name: 2. Asset Service (Port 8081)
        url: /services/assets/v3/api-docs
      - name: 3. Shipment Service (Port 8082)
        url: /services/shipments/v3/api-docs
      - name: 4. Routing Service (Port 8083)
        url: /services/routing/v3/api-docs
      - name: 5. Tracking Service (Port 8084)
        url: /services/tracking/v3/api-docs
      - name: 6. Carbon Service (Port 8085)
        url: /services/carbon/v3/api-docs
      - name: 7. Incident Service (Port 8086)
        url: /services/incidents/v3/api-docs
      - name: 8. Notification Service (Port 8087)
        url: /services/notifications/v3/api-docs
      - name: 9. Payment & Green Billing Service (Port 8088)
        url: /services/payments/v3/api-docs

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Swagger OpenAPI Doc Aggregation Routes
        - id: doc-identity-service
          uri: http://localhost:8080
          predicates:
            - Path=/services/identity/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-asset-service
          uri: http://localhost:8081
          predicates:
            - Path=/services/assets/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-shipment-service
          uri: http://localhost:8082
          predicates:
            - Path=/services/shipments/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-routing-service
          uri: http://localhost:8083
          predicates:
            - Path=/services/routing/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-tracking-service
          uri: http://localhost:8084
          predicates:
            - Path=/services/tracking/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-carbon-service
          uri: http://localhost:8085
          predicates:
            - Path=/services/carbon/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-incident-service
          uri: http://localhost:8086
          predicates:
            - Path=/services/incidents/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/services/notifications/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-payment-service
          uri: http://localhost:8088
          predicates:
            - Path=/services/payments/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # Microservice API Routes
        - id: identity-service-auth
          uri: http://localhost:8080
          predicates:
            - Path=${app.api-prefix}/auth/**,${app.api-prefix}/users/**,${app.api-prefix}/roles/**,${app.api-prefix}/permissions/**
        - id: identity-service-health
          uri: http://localhost:8080
          predicates:
            - Path=${app.api-prefix}/health
        - id: asset-service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/assets/**
        - id: shipment-service
          uri: http://localhost:8082
          predicates:
            - Path=${app.api-prefix}/shipments/**
        - id: routing-service
          uri: http://localhost:8083
          predicates:
            - Path=${app.api-prefix}/routing/**,${app.api-prefix}/routes/**
        - id: tracking-service
          uri: http://localhost:8084
          predicates:
            - Path=${app.api-prefix}/tracking/**
        - id: carbon-service
          uri: http://localhost:8085
          predicates:
            - Path=${app.api-prefix}/carbon/**
        - id: incident-service
          uri: http://localhost:8086
          predicates:
            - Path=${app.api-prefix}/incidents/**
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=${app.api-prefix}/notifications/**
        - id: payment-service
          uri: http://localhost:8088
          predicates:
            - Path=${app.api-prefix}/payments/**,${app.api-prefix}/contracts/**
