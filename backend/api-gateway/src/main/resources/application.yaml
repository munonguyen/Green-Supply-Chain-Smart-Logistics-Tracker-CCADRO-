server:
  port: 8888
  address: ${SERVER_ADDRESS:0.0.0.0}

app:
  api-prefix: /api/v1

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    persistAuthorization: true
    displayRequestDuration: true
    tryItOutEnabled: true
    urls:
      - name: 1. Identity Service (Port 8080)
        url: /services/identity/v3/api-docs
      - name: 2. Asset Service (Port 8081)
        url: /services/assets/v3/api-docs
      - name: 3. Shipment Service (Port 8082)
        url: /services/shipments/v3/api-docs
      - name: 4. Routing Service (Port 8083)
        url: /services/routing/v3/api-docs
      - name: 5. Tracking Service (Port 8084)
        url: /services/tracking/v3/api-docs
      - name: 6. Carbon Service (Port 8085)
        url: /services/carbon/v3/api-docs
      - name: 7. Incident Service (Port 8086)
        url: /services/incidents/v3/api-docs
      - name: 8. Notification Service (Port 8087)
        url: /services/notifications/v3/api-docs
      - name: 9. Payment & Green Billing Service (Port 8088)
        url: /services/payments/v3/api-docs
      - name: 10. Hub & Last-Mile Shipper Service (Port 8089)
        url: /services/hub-shipper/v3/api-docs
      - name: 11. MongoDB Chat Service (Port 8090)
        url: /services/chat/v3/api-docs

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1500ms
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # Swagger OpenAPI Doc Aggregation Routes
        - id: doc-identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/services/identity/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-asset-service
          uri: http://localhost:8081
          predicates:
            - Path=/services/assets/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-shipment-service
          uri: http://localhost:8082
          predicates:
            - Path=/services/shipments/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-routing-service
          uri: http://localhost:8083
          predicates:
            - Path=/services/routing/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-tracking-service
          uri: http://localhost:8084
          predicates:
            - Path=/services/tracking/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-carbon-service
          uri: http://localhost:8085
          predicates:
            - Path=/services/carbon/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-incident-service
          uri: http://localhost:8086
          predicates:
            - Path=/services/incidents/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/services/notifications/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-payment-service
          uri: http://localhost:8088
          predicates:
            - Path=/services/payments/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: doc-hub-shipper-service
          uri: http://localhost:8089
          predicates:
            - Path=/services/hub-shipper/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: doc-chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/services/chat/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: chat-socketio-websocket
          uri: ${CHAT_SOCKET_URL:ws://127.0.0.1:8091}
          predicates:
            - Path=${app.api-prefix}/chat/socket.io/**
            - Header=Upgrade, websocket
        - id: chat-socketio-polling
          uri: ${CHAT_SOCKET_HTTP_URL:http://127.0.0.1:8091}
          predicates:
            - Path=${app.api-prefix}/chat/socket.io/**
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=${app.api-prefix}/chat/**

        # Microservice API Routes
        - id: identity-service-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=${app.api-prefix}/auth/**,${app.api-prefix}/users/**,${app.api-prefix}/roles/**,${app.api-prefix}/permissions/**,${app.api-prefix}/hub-iam/**,${app.api-prefix}/companies/**,${app.api-prefix}/branches/**,${app.api-prefix}/staff/**,${app.api-prefix}/careers/**,${app.api-prefix}/applications/**
        - id: identity-service-health
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=${app.api-prefix}/health
        - id: identity-service-admin-system
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=${app.api-prefix}/admin/system/**
        - id: identity-service-actuator
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/actuator/**,${app.api-prefix}/actuator/**
        - id: asset-service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/assets/**
        - id: shipment-service
          uri: http://localhost:8082
          predicates:
            - Path=${app.api-prefix}/shipments/**
        - id: routing-service
          uri: http://localhost:8083
          predicates:
            - Path=${app.api-prefix}/routing/**,${app.api-prefix}/routes/**
        - id: tracking-service
          uri: http://localhost:8084
          predicates:
            - Path=${app.api-prefix}/tracking/**
        - id: carbon-service
          uri: http://localhost:8085
          predicates:
            - Path=${app.api-prefix}/carbon/**
        - id: incident-service
          uri: http://localhost:8086
          predicates:
            - Path=${app.api-prefix}/incidents/**
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=${app.api-prefix}/notifications/**
        - id: payment-service
          uri: http://localhost:8088
          predicates:
            - Path=${app.api-prefix}/payments/**,${app.api-prefix}/contracts/**
        - id: hub-shipper-service
          uri: http://localhost:8089
          predicates:
            - Path=${app.api-prefix}/hub-shipper/**

# Infrastructure registry is separate from business UI. dev-start enables registration.
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: true
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_ID:${server.port}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
