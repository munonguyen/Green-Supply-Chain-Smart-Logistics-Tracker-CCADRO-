server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ccadro}
    username: ${DB_USER:ccadro}
    password: ${DB_PASSWORD:ccadro_dev_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# CCADRO Business Configurations
ccadro:
  routing:
    provider: ${ROUTING_PROVIDER:mock}
    baseUrl: ${ROUTING_BASE_URL:http://router.project-osrm.org}
    connectTimeoutMs: 5000
    readTimeoutMs: 10000
  deviation:
    yellowMeters: ${CCADRO_DEVIATION_YELLOW_METERS:50}
    redMeters: ${CCADRO_DEVIATION_RED_METERS:200}
    consecutivePointsRequired: 3
  carbon:
    defaultTonneKmFactor: ${CCADRO_CARBON_DEFAULT_TONNE_KM_FACTOR:0.080000}
    distanceAdjustmentFactor: ${CCADRO_CARBON_DAF:1.05}
    applyDafOnActualGps: ${CCADRO_CARBON_APPLY_DAF_ON_ACTUAL_GPS:false}
    factorVersion: ${CCADRO_CARBON_FACTOR_VERSION:GLEC_v3.0}
  demerit:
    warningThreshold: ${CCADRO_DEMERIT_WARNING_THRESHOLD:10}
    reviewRequiredThreshold: ${CCADRO_DEMERIT_REVIEW_THRESHOLD:20}
  security:
    jwtSecret: ${JWT_SECRET:}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION:900}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:604800}

# Springdoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:false}
    operationsSorter: method
    tagsSorter: alpha

# Infrastructure registry is separate from business UI. dev-start enables registration.
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: true
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_ID:${server.port}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health
